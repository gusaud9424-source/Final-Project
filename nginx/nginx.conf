events {}

http {
  # 응답 헤더에 Nginx 버전 숨김
  server_tokens off;

  # ── 보안 응답 헤더 값 ─────────────────────────────────────────────
  # 앱 화면용 CSP
  #  - 스크립트: 자기 출처만 (인라인 · eval 금지)
  #  - 스타일: Vite/Vue 가 넣는 <style> 때문에 'unsafe-inline' 허용, Pretendard CDN 허용
  #  - 프레임: 자기 출처만 (XSS 실습 프레임 /practice-frame.html)
  #  - frame-ancestors: 다른 사이트가 우리 화면을 iframe 으로 감싸지 못하게 (클릭재킹 방어)
  map $uri $sq_app_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data: https://cdn.jsdelivr.net; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
  }

  # XSS 실습 프레임 전용 CSP
  #  - 실습 특성상 인라인 스크립트 · 이벤트 핸들러 허용 (의도적 취약)
  #  - 대신 외부 통신 · 외부 리소스 · 폼 전송 · 하위 프레임을 모두 막아 실습 페이지 밖으로 못 나가게 함
  #  - iframe sandbox="allow-scripts" (opaque origin) 와 함께 써서 앱 쿠키 · 세션 접근 차단
  map $uri $sq_practice_csp {
    default "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; frame-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'self'";
  }

  server {
    listen 80;

    # API: JSON 만 응답하므로 가장 엄격하게
    location /api/ {
      proxy_pass http://backend:5000/api/;
      proxy_set_header Host $host;

      add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /pdf/ {
      proxy_pass http://backend:5000/pdf/;
      proxy_set_header Host $host;

      add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    location /practice/ {
      proxy_pass http://backend:5000/practice/;
      proxy_set_header Host $host;

      add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
    }

    # XSS 실습 미리보기 프레임 (frontend/public/practice-frame.*)
    location ~ ^/practice-frame\.(html|js)$ {
      proxy_pass http://frontend:5173;
      proxy_set_header Host $host;

      add_header Content-Security-Policy $sq_practice_csp always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "no-referrer" always;
    }

    # 앱 화면 (Vue)
    location / {
      proxy_pass http://frontend:5173/;
      proxy_set_header Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      add_header Content-Security-Policy $sq_app_csp always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }
  }
}
